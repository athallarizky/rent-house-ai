services:
  geo-router:
    build:
      context: .
      dockerfile: Dockerfile.geo
    container_name: kos-geo
    ports:
      - "3001:3001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/resolve?q=bandung',r=>{process.exit(r.statusCode===200?0:1)})"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - kos-net

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: kos-api
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - model-cache:/root/.cache/huggingface
    env_file:
      - .env.docker
    restart: unless-stopped
    depends_on:
      geo-router:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - kos-net

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        PUBLIC_API_URL: http://localhost:8080
    container_name: kos-web
    ports:
      - "80:80"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks:
      - kos-net

volumes:
  model-cache:

networks:
  kos-net:
    driver: bridge
